name: Build
on: [push, pull_request, workflow_dispatch]
permissions: {contents: read, actions: read}
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Nabla (${{ matrix.os }}, ${{ matrix.config.name }})
    runs-on: ${{ matrix.os }}
    defaults: {run: {shell: "${{ matrix.shell }}"}}

    env:
      NBL_CI_MODE: "ON"
      NBL_CI_BUILD_DIRECTORY: ${{ github.workspace }}/build-ct
      CONAN_HOME: ${{ github.workspace }}/.conan2
      CONAN_NON_INTERACTIVE: "1"
      CUDA_VERSION: "13.2.1"
      CUDA_CACHE_BASE: ${{ github.workspace }}/.cuda

    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
        config: [{name: Debug, deps: Debug}, {name: Release, deps: Release}, {name: RelWithDebInfo, deps: Release}]
        include:
          - os: windows-2025
            shell: pwsh
            vendor: msvc
            host_profile: windows-msvc195-x64-md
            build_profile: windows-msvc195-x64-md

    steps:
      - uses: actions/checkout@v6
        with: {submodules: recursive}

      - uses: actions/checkout@v6
        with: {repository: Devsh-Graphics-Programming/conan-config, path: conan-config}

      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: .github/workflows/build-nabla.yml}

      - run: python -m pip install conan==2.34.0
      - run: conan config install ./conan-config/config

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with: {arch: x64}

      - uses: Devsh-Graphics-Programming/install-vulkan-sdk-action@v1.4.0-devsh.1
        with:
            install_runtime: true
            cache: true
            stripdown: true
            install_lavapipe: true
            github_token: ${{ github.token }}

      - id: cuda
        run: python .github/scripts/ci_cuda_toolkit.py outputs

      - uses: actions/cache@v5
        id: cuda-cache
        with:
          path: ${{ steps.cuda.outputs.cache_root }}
          key: ${{ steps.cuda.outputs.cache_key }}
          restore-keys: ${{ steps.cuda.outputs.cache_restore_key }}

      - if: steps.cuda-cache.outputs.cache-hit != 'true'
        run: python .github/scripts/ci_cuda_toolkit.py install
      - run: python .github/scripts/ci_cuda_toolkit.py verify

      - uses: actions/cache/restore@v5
        id: cache-conan-restore
        with:
          path: ~/.conan2
          key: conan-windows-msvc

      - name: Configure
        run: |
          New-Item -ItemType Directory -Force profiling | Out-Null
          cmake --preset ci-configure-dynamic-${{ matrix.vendor }} -DCMAKE_INSTALL_PREFIX:PATH="${{ github.workspace }}/build-ct/install" -DNBL_ENABLE_DOCKER_INTEGRATION=OFF -DCONAN_HOST_PROFILE=${{ matrix.host_profile }} -DCONAN_BUILD_PROFILE=${{ matrix.build_profile }} -DCONAN_INSTALL_ARGS=--build=never -DCONAN_INSTALL_BUILD_CONFIGURATIONS=${{ matrix.config.deps }} -DCMAKE_MAP_IMPORTED_CONFIG_RELWITHDEBINFO=Release -DNBL_CUDA_TOOLKIT_ROOT:PATH="${{ steps.cuda.outputs.cache_root }}" --profiling-output=profiling/cmake-profiling.json --profiling-format=google-trace

      - uses: actions/cache/save@v5
        id: cache-conan-save
        with:
          path: ~/.conan2
          key: conan-windows-msvc

      - name: Build and install
        run: cmake --build --preset ci-build-dynamic-${{ matrix.vendor }} --target install --config ${{ matrix.config.name }}

      - run: tar -cf nabla-install.tar build-ct/install && tar -cf nabla-profiling.tar profiling

      - uses: actions/upload-artifact@v7
        with: {name: "nabla-${{ matrix.os }}-${{ matrix.vendor }}-${{ matrix.config.name }}-install", path: nabla-install.tar, compression-level: 0}
      - uses: actions/upload-artifact@v7
        with: {name: "nabla-${{ matrix.os }}-${{ matrix.vendor }}-${{ matrix.config.name }}-profiling", path: nabla-profiling.tar}

      - uses: actions/cache@v5
        if: runner.os == 'Windows'
        id: rg-cache
        with: {path: "${{ runner.temp }}/ripgrep-14.1.1-x86_64-pc-windows-msvc", key: ripgrep-14.1.1-x86_64-pc-windows-msvc}

      - if: runner.os == 'Windows' && steps.rg-cache.outputs.cache-hit != 'true'
        run: |
          Invoke-WebRequest https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/ripgrep-14.1.1-x86_64-pc-windows-msvc.zip -OutFile "$env:RUNNER_TEMP/rg.zip"
          Expand-Archive "$env:RUNNER_TEMP/rg.zip" $env:RUNNER_TEMP -Force

      - if: runner.os == 'Windows'
        run: '"$env:RUNNER_TEMP/ripgrep-14.1.1-x86_64-pc-windows-msvc" >> $env:GITHUB_PATH'
      - name: Package sources
        shell: bash
        run: MSYS_NO_PATHCONV=1 rg --files -uu -0 --path-separator=/ -g '*.{c,cc,cpp,cxx,h,hh,hpp,hxx,inc,inl,ipp,tpp,ixx}' -g '!.git/**' -g '!.conan2/**' -g '!.cuda/**' -g '!examples_tests/media/**' . | tar --null -T - -cf nabla-source.tar
      - uses: actions/upload-artifact@v7
        with: {name: "nabla-${{ matrix.os }}-${{ matrix.vendor }}-${{ matrix.config.name }}-source", path: nabla-source.tar}

      - name: Install NSC runtime bundle
        if: runner.os == 'Windows' && matrix.config.name == 'Release'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          @('PackageConfig', 'Runtimes', 'NSCExecutables', 'NSCConfig') | ForEach-Object { cmake --install build-ct --config Release --prefix build-ct/nsc-package --component $_ }
          & ./build-ct/nsc-package/exe/tools/nsc/bin/nsc.exe --dump-build-info --file build-ct/nsc-package/exe/tools/nsc/bin/build-info.json

      - name: Prepare NSC channel
        if: runner.os == 'Windows' && matrix.config.name == 'Release'
        run: cmake -D SOURCE_ROOT=build-ct/nsc-package -D PAYLOAD_ROOT=build-ct/nsc-release/payload -D MANIFEST_ROOT=build-ct/nsc-release/manifests -D CHANNEL=nsc-windows-x64-release -D MANIFESTS_ZIP=build-ct/nsc-release/nsc-windows-x64-release-manifests.zip -D PRUNE=ON -P cmake/nam/cmake/NablaAssetManifestsPrepareRelease.cmake

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows' && matrix.config.name == 'Release'
        with: {name: nsc-windows-x64-release-payload, path: build-ct/nsc-release/payload, if-no-files-found: error}

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows' && matrix.config.name == 'Release'
        with: {name: nsc-windows-x64-release-manifests, path: build-ct/nsc-release/nsc-windows-x64-release-manifests.zip, if-no-files-found: error}

      - name: Build examples
        run: cmake --build --preset ci-build-dynamic-${{ matrix.vendor }} --target examples_tests/all --config ${{ matrix.config.name }} -- -k 0

      - name: Install examples
        run: cmake --install build-ct/examples_tests --prefix build-ct/install --config ${{ matrix.config.name }}

      - run: tar -xf nabla-install.tar -C smoke
      - run: cmake -D FLOW=MINIMALISTIC -D CONFIG=${{ matrix.config.name }} -P smoke/RunSmokeFlow.cmake
      - run: cmake -D FLOW=CONFIGURE_ONLY -D CONFIG=${{ matrix.config.name }} -P smoke/RunSmokeFlow.cmake
      - run: cmake -D FLOW=BUILD_ONLY -D CONFIG=${{ matrix.config.name }} -P smoke/RunSmokeFlow.cmake

      - name: Configure CUDA interop smoke
        run: cmake -S src/nbl/ext/CUDAInterop/smoke -B smoke/cuda-interop-smoke -D "CMAKE_PREFIX_PATH=${{ github.workspace }}/smoke/build-ct/install/cmake" -D NBL_CUDA_INTEROP_SMOKE_WITH_NATIVE=ON -D "Nabla_CUDA_TOOLKIT_ROOT=${{ steps.cuda.outputs.cache_root }}"
      - run: cmake --build smoke/cuda-interop-smoke --config ${{ matrix.config.name }}